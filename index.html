<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <title>Workout Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script src="./data.js" defer></script>
  <script src="./routine-overrides.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="icon-button hidden" id="backButton" aria-label="Go back">←</button>
      <div class="title-wrap">
        <div class="eyebrow">LOCAL-ONLY</div>
        <h1 id="pageTitle">Workout Tracker</h1>
      </div>
      <button class="icon-button" id="menuButton" aria-label="Open settings">⚙</button>
    </header>
    <main id="app"></main>
  </div>

  <input type="file" id="importFile" accept="application/json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
